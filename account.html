<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tài khoản — Lịch sử mua</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#080b11;color:#f6f7fb}main{max-width:760px;margin:auto;padding:24px 16px 60px}.panel{background:#111821;border:1px solid #293548;border-radius:18px;padding:18px;margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0}.muted{color:#9faabd}.error{color:#ff9b9b}.ok{color:#8ef0ad}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;font:inherit}input{background:#0b1017;color:#fff;border:1px solid #334055;margin:7px 0}button{border:0;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#202938}.order{background:#0d131c;border:1px solid #293548;border-radius:14px;padding:15px;margin:12px 0}.status{font-weight:800}.download{display:inline-block;text-decoration:none;background:#25c45a;color:#fff;padding:11px 14px;border-radius:10px;font-weight:800}</style>
<style id="ios-liquid-glass-buttons">
:root{--ios-glass-border:rgba(225,218,255,.34);--ios-glass-highlight:rgba(255,255,255,.22);--ios-glass-shadow:rgba(3,6,18,.38)}
button,.auth-link,.admin-free a,.download,a.button,.btn,input[type=submit],input[type=button]{-webkit-appearance:none;appearance:none;position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 16px;border:1px solid var(--ios-glass-border)!important;border-radius:999px!important;background:linear-gradient(145deg,rgba(255,255,255,.19),rgba(178,157,255,.09) 42%,rgba(77,92,160,.16))!important;color:#f8f6ff!important;font:inherit;font-weight:750;letter-spacing:.01em;text-decoration:none!important;text-shadow:0 1px 8px rgba(0,0,0,.22);box-shadow:inset 0 1px 0 var(--ios-glass-highlight),inset 0 -1px 0 rgba(255,255,255,.04),0 7px 22px var(--ios-glass-shadow),0 0 16px rgba(139,92,246,.10);backdrop-filter:blur(22px) saturate(175%);-webkit-backdrop-filter:blur(22px) saturate(175%);transition:transform .18s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease,filter .2s ease;cursor:pointer;overflow:hidden}
button:before,.auth-link:before,.admin-free a:before,.download:before,a.button:before,.btn:before{content:"";position:absolute;inset:1px 12% auto;height:42%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.19),transparent);pointer-events:none;z-index:-1}
button:hover,.auth-link:hover,.admin-free a:hover,.download:hover,a.button:hover,.btn:hover,input[type=submit]:hover,input[type=button]:hover{transform:translateY(-1px);border-color:rgba(233,225,255,.68)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 28px rgba(3,6,18,.42),0 0 22px rgba(168,85,247,.22);filter:brightness(1.08)}
button:active,.auth-link:active,.admin-free a:active,.download:active,a.button:active,.btn:active,input[type=submit]:active,input[type=button]:active{transform:scale(.965);filter:brightness(1.15);transition-duration:.08s}
button:focus-visible,.auth-link:focus-visible,.admin-free a:focus-visible,.download:focus-visible,a.button:focus-visible,.btn:focus-visible,input[type=submit]:focus-visible,input[type=button]:focus-visible{outline:2px solid rgba(196,181,253,.9);outline-offset:3px}
button:disabled,input:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.55);transform:none;box-shadow:none}
.actions button.buy,.actions button.buy.blue,.download,#check{background:linear-gradient(135deg,rgba(139,92,246,.66),rgba(99,102,241,.38) 55%,rgba(56,189,248,.18))!important;border-color:rgba(221,207,255,.55)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 24px rgba(91,53,170,.28),0 0 20px rgba(139,92,246,.18)}
.actions button:not(.buy),button.secondary{background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(130,145,190,.08))!important}
.card select,select{border-radius:15px!important;border-color:rgba(196,181,253,.3)!important;background-color:rgba(12,16,34,.78)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
@media(max-width:600px){button,.auth-link,.admin-free a,.download,a.button,.btn,input[type=submit],input[type=button]{min-height:40px;padding:9px 13px;font-size:14px}}
@media(prefers-reduced-motion:reduce){button,.auth-link,.admin-free a,.download,a.button,.btn{transition:none}}
</style>
</head><body><main><div class="row"><h1>Lịch sử mua</h1><button class="secondary" style="width:auto" onclick="logout()">Đăng xuất</button></div><section id="auth" class="panel"><h2>Đăng nhập / Đăng ký</h2><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu (tối thiểu 6 ký tự)"><div class="row"><button style="width:auto;flex:1" onclick="login()">Đăng nhập</button><button class="secondary" style="width:auto;flex:1" onclick="register()">Đăng ký</button></div><p id="msg" class="muted"></p></section><section id="history" class="panel" style="display:none"><h2>Các sản phẩm đã mua</h2><div id="orders"></div></section></main><script>const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(url,opt={}){let r;try{r=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'})}catch(e){throw Error('Không kết nối được máy chủ đăng nhập.')}const text=await r.text();let x={};try{x=JSON.parse(text)}catch{}if(!r.ok)throw Error(x.error||(r.status===404?'Backend đăng nhập chưa được deploy. Hãy dùng Render Web Service, không phải Static Site.':'Máy chủ đăng nhập chưa sẵn sàng.'));return x}async function register(){try{const email=$('email').value.trim(),password=$('password').value;await api('/api/auth/register',{method:'POST',body:JSON.stringify({email,password})});$('msg').textContent='Đăng ký thành công.';await load()}catch(e){$('msg').textContent=e.message}}async function login(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const next=new URLSearchParams(location.search).get('next');location.href=next||location.pathname}catch(e){$('msg').textContent=e.message}}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}async function load(){const me=await api('/api/auth/me');if(!me.authenticated){$('history').style.display='none';$('auth').style.display='block';return}$('auth').style.display='none';$('history').style.display='block';const x=await api('/api/account/orders');$('orders').innerHTML=x.orders.length?x.orders.map(o=>`<div class="order"><h3>${esc(o.productName)}</h3><div>Giá: <b>${esc(new Intl.NumberFormat('vi-VN').format(o.price))}đ</b></div><div>Ngày mua: <b>${esc(o.purchaseDate)}</b> — ${esc(o.purchaseTime)}</div><div class="status ${o.status==='Đã duyệt'?'ok':'muted'}">${esc(o.status)}</div>${o.status==='Đã duyệt'?`<p><a class="download" href="${encodeURI(o.downloadUrl)}">Tải lại</a></p>`:'<p class="muted">Chờ Admin xác nhận thanh toán.</p>'}</div>`).join(''):'<p class="muted">Chưa có sản phẩm đã mua.</p>'}load().catch(e=>{$('msg').textContent=e.message})</script></body></html>
