<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tài khoản — Lịch sử mua</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#080b11;color:#f6f7fb}main{max-width:760px;margin:auto;padding:24px 16px 60px}.panel{background:#111821;border:1px solid #293548;border-radius:18px;padding:18px;margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0}.muted{color:#9faabd}.error{color:#ff9b9b}.ok{color:#8ef0ad}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;font:inherit}input{background:#0b1017;color:#fff;border:1px solid #334055;margin:7px 0}button{border:0;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#202938}.order{background:#0d131c;border:1px solid #293548;border-radius:14px;padding:15px;margin:12px 0}.status{font-weight:800}.download{display:inline-block;text-decoration:none;background:#25c45a;color:#fff;padding:11px 14px;border-radius:10px;font-weight:800}</style></head><body><main><div class="row"><h1>Lịch sử mua</h1><button class="secondary" style="width:auto" onclick="logout()">Đăng xuất</button></div><section id="auth" class="panel"><h2>Đăng nhập / Đăng ký</h2><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu (tối thiểu 6 ký tự)"><div class="row"><button style="width:auto;flex:1" onclick="login()">Đăng nhập</button><button class="secondary" style="width:auto;flex:1" onclick="register()">Đăng ký</button></div><p id="msg" class="muted"></p></section><section id="history" class="panel" style="display:none"><h2>Các sản phẩm đã mua</h2><div id="orders"></div></section></main><script>const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Có lỗi xảy ra');return x}async function register(){try{const email=$('email').value.trim(),password=$('password').value;const x=await api('/api/auth/register',{method:'POST',body:JSON.stringify({email,password})});$('msg').textContent=x.message||'Đăng ký thành công.'}catch(e){$('msg').textContent=e.message}}async function login(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const next=new URLSearchParams(location.search).get('next');location.href=next||location.pathname}catch(e){$('msg').textContent=e.message}}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}async function load(){const me=await api('/api/auth/me');if(!me.authenticated){$('history').style.display='none';$('auth').style.display='block';return}$('auth').style.display='none';$('history').style.display='block';const x=await api('/api/account/orders');$('orders').innerHTML=x.orders.length?x.orders.map(o=>`<div class="order"><h3>${esc(o.productName)}</h3><div>Giá: <b>${esc(new Intl.NumberFormat('vi-VN').format(o.price))}đ</b></div><div>Ngày mua: <b>${esc(o.purchaseDate)}</b> — ${esc(o.purchaseTime)}</div><div class="status ${o.status==='Đã duyệt'?'ok':'muted'}">${esc(o.status)}</div>${o.status==='Đã duyệt'?`<p><a class="download" href="${encodeURI(o.downloadUrl)}">Tải lại</a></p>`:'<p class="muted">Chờ Admin xác nhận thanh toán.</p>'}</div>`).join(''):'<p class="muted">Chưa có sản phẩm đã mua.</p>'}load().catch(e=>{$('msg').textContent=e.message})</script></body></html>
