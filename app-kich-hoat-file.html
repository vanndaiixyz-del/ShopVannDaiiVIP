<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Kích hoạt file</title>
<style>
body{font-family:system-ui;margin:0;padding:24px;background:#f5f5f5}
.card{max-width:620px;margin:auto;background:#fff;padding:24px;border-radius:18px}
button{padding:12px 18px;border:0;border-radius:10px;font-weight:700}
</style>

<style id="ios-liquid-glass-buttons">
:root{--ios-glass-border:rgba(225,218,255,.34);--ios-glass-highlight:rgba(255,255,255,.22);--ios-glass-shadow:rgba(3,6,18,.38)}
button,.auth-link,.admin-free a,.download,a.button,.btn,input[type=submit],input[type=button]{-webkit-appearance:none;appearance:none;position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 16px;border:1px solid var(--ios-glass-border)!important;border-radius:999px!important;background:linear-gradient(145deg,rgba(255,255,255,.19),rgba(178,157,255,.09) 42%,rgba(77,92,160,.16))!important;color:#f8f6ff!important;font:inherit;font-weight:750;letter-spacing:.01em;text-decoration:none!important;text-shadow:0 1px 8px rgba(0,0,0,.22);box-shadow:inset 0 1px 0 var(--ios-glass-highlight),inset 0 -1px 0 rgba(255,255,255,.04),0 7px 22px var(--ios-glass-shadow),0 0 16px rgba(139,92,246,.10);backdrop-filter:blur(22px) saturate(175%);-webkit-backdrop-filter:blur(22px) saturate(175%);transition:transform .18s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease,filter .2s ease;cursor:pointer;overflow:hidden}
button:before,.auth-link:before,.admin-free a:before,.download:before,a.button:before,.btn:before{content:"";position:absolute;inset:1px 12% auto;height:42%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.19),transparent);pointer-events:none;z-index:-1}
button:hover,.auth-link:hover,.admin-free a:hover,.download:hover,a.button:hover,.btn:hover,input[type=submit]:hover,input[type=button]:hover{transform:translateY(-1px);border-color:rgba(233,225,255,.68)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 28px rgba(3,6,18,.42),0 0 22px rgba(168,85,247,.22);filter:brightness(1.08)}
button:active,.auth-link:active,.admin-free a:active,.download:active,a.button:active,.btn:active,input[type=submit]:active,input[type=button]:active{transform:scale(.965);filter:brightness(1.15);transition-duration:.08s}
button:focus-visible,.auth-link:focus-visible,.admin-free a:focus-visible,.download:focus-visible,a.button:focus-visible,.btn:focus-visible,input[type=submit]:focus-visible,input[type=button]:focus-visible{outline:2px solid rgba(196,181,253,.9);outline-offset:3px}
button:disabled,input:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.55);transform:none;box-shadow:none}
.actions button.buy,.actions button.buy.blue,.download,#check{background:linear-gradient(135deg,rgba(139,92,246,.66),rgba(99,102,241,.38) 55%,rgba(56,189,248,.18))!important;border-color:rgba(221,207,255,.55)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 24px rgba(91,53,170,.28),0 0 20px rgba(139,92,246,.18)}
.actions button:not(.buy),button.secondary{background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(130,145,190,.08))!important}
.card select,select{border-radius:15px!important;border-color:rgba(196,181,253,.3)!important;background-color:rgba(12,16,34,.78)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
@media(max-width:600px){button,.auth-link,.admin-free a,.download,a.button,.btn,input[type=submit],input[type=button]{min-height:40px;padding:9px 13px;font-size:14px}}
@media(prefers-reduced-motion:reduce){button,.auth-link,.admin-free a,.download,a.button,.btn{transition:none}}
</style>
</head>
<body><main class="card">
<h1>App Kích hoạt file</h1>
<p><strong>Miễn phí — 0đ</strong></p>
<p>Sản phẩm miễn phí, không cần thanh toán.</p>
<button type="button" onclick="alert('Sản phẩm miễn phí — có thể tải từ khu vực sản phẩm khi file hợp lệ được cung cấp.')">Tải miễn phí</button>
</main></body>
</html>
